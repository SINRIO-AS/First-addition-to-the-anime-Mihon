name: Build ShahiidAnime Aniyomi APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: custom-repo

      - name: Show repository files
        run: |
          echo "Repository files:"
          find custom-repo -maxdepth 8 -print | sort

      - name: Checkout Yuzono anime-extensions
        uses: actions/checkout@v4
        with:
          repository: yuzono/anime-extensions
          path: anime-extensions

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find and copy ShahiidAnime Aniyomi extension
        run: |
          set -e

          rm -rf work
          mkdir -p work

          ZIP_FILE="$(find custom-repo -maxdepth 1 -type f -iname '*aniyomi*.zip' | sort | head -n 1 || true)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No Aniyomi ZIP file found in repository root. Upload shahiidanime-aniyomi-phone-build.zip beside README.md."
            find custom-repo -maxdepth 3 -print | sort
            exit 1
          fi

          echo "Found ZIP file: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d work

          BUILD_FILE="$(find work -path '*/src/ar/shahiidanime/build.gradle' | head -n 1 || true)"

          if [ -z "$BUILD_FILE" ]; then
            echo "::error::Could not find src/ar/shahiidanime/build.gradle inside the Aniyomi ZIP."
            find work -maxdepth 8 -print | sort
            exit 1
          fi

          EXT_DIR="$(dirname "$BUILD_FILE")"
          KOTLIN_FILE="$EXT_DIR/src/eu/kanade/tachiyomi/animeextension/ar/shahiidanime/ShahiidAnime.kt"

          if [ ! -f "$KOTLIN_FILE" ]; then
            echo "::error::This does not look like an Aniyomi extension. Missing animeextension package file."
            find "$EXT_DIR" -maxdepth 8 -print | sort
            exit 1
          fi

          rm -rf anime-extensions/src/ar/shahiidanime
          mkdir -p anime-extensions/src/ar
          cp -R "$EXT_DIR" anime-extensions/src/ar/shahiidanime

          echo "Copied extension files:"
          find anime-extensions/src/ar/shahiidanime -maxdepth 8 -print | sort

      - name: Apply Kotlin formatting
        working-directory: anime-extensions
        run: ./gradlew src:ar:shahiidanime:spotlessApply

      - name: Build debug APK
        working-directory: anime-extensions
        run: ./gradlew src:ar:shahiidanime:assembleDebug --stacktrace

      - name: Show APK files
        if: always()
        run: find anime-extensions/src/ar/shahiidanime/build/outputs -type f | sort || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shahiidanime-aniyomi-debug-apk
          path: anime-extensions/src/ar/shahiidanime/build/outputs/apk/**/*.apk
          if-no-files-found: error
